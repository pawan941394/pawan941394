<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" role="img" aria-label="Footer connect">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060814"/><stop offset="50%" stop-color="#0c1330"/><stop offset="100%" stop-color="#060814"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/><stop offset="50%" stop-color="#7f5aeb"/><stop offset="100%" stop-color="#ff0844"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes glow { 0%,100%{opacity:.5} 50%{opacity:1} }
    @keyframes typeBlink { 0%,100%{opacity:1} 50%{opacity:0} }
    .glow{animation:glow 2.5s ease-in-out infinite}
    .cursor{animation:typeBlink .8s step-end infinite}
  </style>
  <rect width="900" height="160" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="158" rx="15" fill="none" stroke="url(#neon)" stroke-opacity=".5" class="glow"/>
  <text x="450" y="55" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="800" font-family="Segoe UI, sans-serif">READY TO BUILD SOMETHING THAT SHIPS?</text>
  <text x="450" y="85" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="Segoe UI, sans-serif">Voice AI · LLM pipelines · Quant strategies  let's talk</text>
  <text x="380" y="120" text-anchor="middle" fill="#00f2fe" font-size="14" font-family="Consolas, monospace" font-weight="700">&gt; connect_now()</text>
  <rect x="500" y="105" width="10" height="18" fill="#00f2fe" class="cursor"/>
  <text x="450" y="145" text-anchor="middle" fill="#586799" font-size="11" font-family="Segoe UI, sans-serif">LinkedIn · Email · YouTube  " use the buttons below</text>
</svg>
