<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 116" width="100%" role="img" aria-label="Subscribe on YouTube">
  <g transform="translate(5,8)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3.5s" begin="0.8s" repeatCount="indefinite"/>
      <rect width="280" height="100" rx="14" fill="#0b1224" stroke="#FF0000" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
      <circle cx="42" cy="50" r="19" fill="#FF0000"/>
      <polygon points="37,42 51,50 37,58" fill="#fff"/>
      <text x="74" y="42" fill="#f8fafc" font-size="16" font-weight="700" font-family="Segoe UI, sans-serif">YouTube</text>
      <text x="74" y="63" fill="#94a3b8" font-size="12" font-family="Segoe UI, sans-serif">Subscribe &amp; learn AI</text>
      <text x="74" y="84" fill="#ff4444" font-size="11" font-weight="700" font-family="Consolas, monospace">click to subscribe -&gt;
        <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" begin="0.8s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
</svg>
