<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" role="img" aria-label="YouTube build in public">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14060a"/><stop offset="100%" stop-color="#060814"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0000" stop-opacity=".35"/><stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes playPulse { 0%,100%{transform:scale(1);opacity:.9} 50%{transform:scale(1.08);opacity:1} }
    @keyframes ringExpand { 0%{r:36;opacity:.6} 100%{r:70;opacity:0} }
    @keyframes marquee { 0%{opacity:.6} 50%{opacity:1} 100%{opacity:.6} }
    .play{transform-origin:160px 110px;animation:playPulse 1.8s ease-in-out infinite}
    .ring{animation:ringExpand 2.2s ease-out infinite}
    .eq{animation:playPulse 1s ease-in-out infinite}
    .e2{animation-delay:.15s}.e3{animation-delay:.3s}.e4{animation-delay:.45s}.e5{animation-delay:.6s}
    .sub{animation:marquee 2.5s ease-in-out infinite}
  </style>
  <rect width="900" height="220" rx="16" fill="url(#bg)"/>
  <circle cx="160" cy="110" r="90" fill="url(#redGlow)"/>
  <circle cx="160" cy="110" r="36" fill="none" stroke="#ff0000" stroke-opacity=".5" class="ring"/>
  <g class="play">
    <circle cx="160" cy="110" r="40" fill="#FF0000"/>
    <polygon points="150,95 180,110 150,125" fill="#fff"/>
  </g>
  <!-- equalizer -->
  <g transform="translate(230,85)" fill="#ff4444">
    <rect class="eq" x="0" y="20" width="8" height="30" rx="2"/>
    <rect class="eq e2" x="14" y="10" width="8" height="40" rx="2"/>
    <rect class="eq e3" x="28" y="5" width="8" height="45" rx="2"/>
    <rect class="eq e4" x="42" y="15" width="8" height="35" rx="2"/>
    <rect class="eq e5" x="56" y="8" width="8" height="42" rx="2"/>
  </g>

  <text x="330" y="75" fill="#f8fafc" font-size="22" font-weight="800" font-family="Segoe UI, sans-serif">BUILD IN PUBLIC</text>
  <text x="330" y="105" fill="#94a3b8" font-size="13" font-family="Segoe UI, sans-serif">Multi-agent systems · Streamlit · Voice chatbots · Scraping</text>
  <text x="330" y="128" fill="#586799" font-size="12" font-family="Segoe UI, sans-serif">@Pawankumar-py4tk  production AI, broken down end-to-end</text>

  <rect x="330" y="150" width="200" height="40" rx="20" fill="#FF0000" class="sub"/>
  <text x="430" y="176" text-anchor="middle" fill="#fff" font-size="14" font-weight="800" font-family="Segoe UI, sans-serif">SUBSCRIBE NOW</text>
</svg>
