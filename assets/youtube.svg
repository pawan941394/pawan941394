<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" role="img" aria-label="YouTube build in public">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14060a"/><stop offset="100%" stop-color="#060814"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0000" stop-opacity="0.35"/><stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="220" rx="16" fill="url(#bg)"/>
  <circle cx="160" cy="110" r="90" fill="url(#redGlow)"/>
  <circle cx="160" cy="110" r="36" fill="none" stroke="#ff0000" stroke-opacity="0.5">
    <animate attributeName="r" values="36;70;36" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(160,110)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="1.8s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="40" fill="#FF0000"/>
      <polygon points="-10,-15 20,0 -10,15" fill="#fff"/>
    </g>
  </g>

  <g fill="#ff4444">
    <rect x="230" y="105" width="8" height="30" rx="2"><animate attributeName="height" values="30;10;30" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="105;125;105" dur="1s" repeatCount="indefinite"/></rect>
    <rect x="244" y="95" width="8" height="40" rx="2"><animate attributeName="height" values="40;16;40" dur="1s" begin="0.15s" repeatCount="indefinite"/><animate attributeName="y" values="95;119;95" dur="1s" begin="0.15s" repeatCount="indefinite"/></rect>
    <rect x="258" y="90" width="8" height="45" rx="2"><animate attributeName="height" values="45;18;45" dur="1s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="y" values="90;117;90" dur="1s" begin="0.3s" repeatCount="indefinite"/></rect>
    <rect x="272" y="100" width="8" height="35" rx="2"><animate attributeName="height" values="35;14;35" dur="1s" begin="0.45s" repeatCount="indefinite"/><animate attributeName="y" values="100;121;100" dur="1s" begin="0.45s" repeatCount="indefinite"/></rect>
    <rect x="286" y="93" width="8" height="42" rx="2"><animate attributeName="height" values="42;16;42" dur="1s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="y" values="93;119;93" dur="1s" begin="0.6s" repeatCount="indefinite"/></rect>
  </g>

  <text x="330" y="75" fill="#f8fafc" font-size="22" font-weight="800" font-family="Segoe UI, sans-serif">BUILD IN PUBLIC</text>
  <text x="330" y="105" fill="#94a3b8" font-size="13" font-family="Segoe UI, sans-serif">Multi-agent systems | Streamlit | Voice chatbots | Scraping</text>
  <text x="330" y="128" fill="#586799" font-size="12" font-family="Segoe UI, sans-serif">@Pawankumar-py4tk - production AI, broken down end-to-end</text>

  <rect x="330" y="150" width="200" height="40" rx="20" fill="#FF0000">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <text x="430" y="176" text-anchor="middle" fill="#fff" font-size="14" font-weight="800" font-family="Segoe UI, sans-serif">SUBSCRIBE NOW</text>
</svg>
