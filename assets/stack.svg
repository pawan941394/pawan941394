  <rect x="460" y="250" width="410" height="120" rx="12" fill="#0b1020" stroke="#1e293b" stroke-width="1"/>
  <text x="485" y="280" fill="#94a3b8" font-size="12" font-weight="800" font-family="Segoe UI, sans-serif" letter-spacing="1.5">CLOUD &amp; AUTOMATION</text>
  <g font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" opacity="0.85">
    <g transform="translate(485,296)"><rect width="66" height="28" rx="14" fill="#0b1224" stroke="#FF9900"/><text x="33" y="18" text-anchor="middle" fill="#fbbf24">AWS</text></g>
