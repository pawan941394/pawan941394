    <g transform="translate(280,250)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.8s" begin="1.2s" repeatCount="indefinite"/><rect width="100" height="36" rx="18" fill="#0b1224" stroke="#0078D4"/><text x="50" y="23" text-anchor="middle" fill="#38bdf8">Azure</text></g></g>
    <g transform="translate(400,250)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.8s" begin="1.3s" repeatCount="indefinite"/><rect width="90" height="36" rx="18" fill="#0b1224" stroke="#F05032"/><text x="45" y="23" text-anchor="middle" fill="#fb923c">Git</text></g></g>
