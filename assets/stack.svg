    <g transform="translate(475,170)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.6s" begin="1.35s" repeatCount="indefinite"/><rect width="170" height="38" rx="19" fill="#0b1224" stroke="#00f2fe" stroke-width="1.5"/><text x="85" y="24" text-anchor="middle" fill="#5eead4">LLM Guardrails</text></g></g>
