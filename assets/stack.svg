    <g transform="translate(670,250)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.8s" begin="1.5s" repeatCount="indefinite"/><rect width="100" height="36" rx="18" fill="#0b1224" stroke="#666"/><text x="50" y="23" text-anchor="middle" fill="#e2e8f0">Flask</text></g></g>
