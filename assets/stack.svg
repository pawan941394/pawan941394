<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" role="img" aria-label="Tech stack">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1f"/><stop offset="100%" stop-color="#060814"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes chip {
      0%,100%{transform:translateY(0);filter:brightness(1)}
      50%{transform:translateY(-3px);filter:brightness(1.25)}
    }
    @keyframes ring { to { stroke-dashoffset: -60 } }
    .chip{animation:chip 2.8s ease-in-out infinite}
    .d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}
    .d4{animation-delay:.4s}.d5{animation-delay:.5s}.d6{animation-delay:.6s}
    .d7{animation-delay:.7s}.d8{animation-delay:.8s}
    .orbit{stroke-dasharray:10 10;animation:ring 2s linear infinite}
  </style>
  <rect width="900" height="340" rx="16" fill="url(#bg)"/>
  <circle cx="450" cy="170" r="48" fill="none" stroke="#7f5aeb" stroke-opacity=".35" stroke-width="1.5" class="orbit"/>
  <circle cx="450" cy="170" r="28" fill="#7f5aeb" fill-opacity=".15" stroke="#00f2fe" stroke-width="1.5"/>
  <text x="450" y="175" text-anchor="middle" fill="#00f2fe" font-size="11" font-weight="800" font-family="Segoe UI, sans-serif">STACK</text>
  <text x="450" y="40" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="800" font-family="Segoe UI, sans-serif" letter-spacing="2">HOLOGRAPHIC CORE</text>

  <!-- Languages -->
  <g class="chip" transform="translate(40,70)"><rect width="120" height="36" rx="18" fill="#0b1224" stroke="#3776AB"/><text x="60" y="23" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">Python</text></g>
  <g class="chip d1" transform="translate(175,70)"><rect width="120" height="36" rx="18" fill="#0b1224" stroke="#3178C6"/><text x="60" y="23" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">TypeScript</text></g>
  <g class="chip d2" transform="translate(310,70)"><rect width="100" height="36" rx="18" fill="#0b1224" stroke="#4479A1"/><text x="50" y="23" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">SQL</text></g>
  <g class="chip d3" transform="translate(425,70)"><rect width="120" height="36" rx="18" fill="#0b1224" stroke="#F7DF1E"/><text x="60" y="23" text-anchor="middle" fill="#fde047" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">JavaScript</text></g>

  <!-- AI -->
  <g class="chip d4" transform="translate(40,130)"><rect width="120" height="36" rx="18" fill="#0b1224" stroke="#EE4C2C"/><text x="60" y="23" text-anchor="middle" fill="#fb7185" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">PyTorch</text></g>
  <g class="chip d5" transform="translate(175,130)"><rect width="120" height="36" rx="18" fill="#0b1224" stroke="#412991"/><text x="60" y="23" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">OpenAI</text></g>
  <g class="chip d6" transform="translate(310,130)"><rect width="130" height="36" rx="18" fill="#0b1224" stroke="#1C3C3C"/><text x="65" y="23" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">LangChain</text></g>
  <g class="chip d7" transform="translate(455,130)"><rect width="110" height="36" rx="18" fill="#0b1224" stroke="#5C3EE8"/><text x="55" y="23" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">OpenCV</text></g>
  <g class="chip d8" transform="translate(580,130)"><rect width="110" height="36" rx="18" fill="#0b1224" stroke="#150458"/><text x="55" y="23" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">Pandas</text></g>

  <!-- Web -->
  <g class="chip d2" transform="translate(560,70)"><rect width="110" height="36" rx="18" fill="#0b1224" stroke="#009688"/><text x="55" y="23" text-anchor="middle" fill="#2dd4bf" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">FastAPI</text></g>
  <g class="chip d3" transform="translate(685,70)"><rect width="110" height="36" rx="18" fill="#0b1224" stroke="#092E20"/><text x="55" y="23" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">Django</text></g>
  <g class="chip d4" transform="translate(710,130)"><rect width="110" height="36" rx="18" fill="#0b1224" stroke="#339933"/><text x="55" y="23" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">Node.js</text></g>

  <!-- Cloud bottom -->
  <g class="chip d5" transform="translate(160,250)"><rect width="100" height="36" rx="18" fill="#0b1224" stroke="#FF9900"/><text x="50" y="23" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">AWS</text></g>
  <g class="chip d6" transform="translate(280,250)"><rect width="100" height="36" rx="18" fill="#0b1224" stroke="#0078D4"/><text x="50" y="23" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">Azure</text></g>
  <g class="chip d7" transform="translate(400,250)"><rect width="90" height="36" rx="18" fill="#0b1224" stroke="#F05032"/><text x="45" y="23" text-anchor="middle" fill="#fb923c" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">Git</text></g>
  <g class="chip d8" transform="translate(510,250)"><rect width="140" height="36" rx="18" fill="#0b1224" stroke="#00f2fe"/><text x="70" y="23" text-anchor="middle" fill="#00f2fe" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">Web Scraping</text></g>
  <g class="chip d1" transform="translate(670,250)"><rect width="100" height="36" rx="18" fill="#0b1224" stroke="#000"/><text x="50" y="23" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">Flask</text></g>

  <text x="450" y="320" text-anchor="middle" fill="#586799" font-size="11" font-family="Segoe UI, sans-serif">Languages | AI/ML | Frameworks | Cloud</text>
</svg>
