    <g transform="translate(195,118)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.6s" begin="0.15s" repeatCount="indefinite"/><rect width="115" height="38" rx="19" fill="#0b1224" stroke="#412991" stroke-width="1.5"/><text x="57" y="24" text-anchor="middle" fill="#c4b5fd">OpenAI</text></g></g>
    <g transform="translate(325,118)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.6s" begin="0.3s" repeatCount="indefinite"/><rect width="130" height="38" rx="19" fill="#0b1224" stroke="#1C3C3C" stroke-width="1.5"/><text x="65" y="24" text-anchor="middle" fill="#5eead4">LangChain</text></g></g>
    <g transform="translate(470,118)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.6s" begin="0.45s" repeatCount="indefinite"/><rect width="150" height="38" rx="19" fill="#0b1224" stroke="#00f2fe" stroke-width="1.5"/><text x="75" y="24" text-anchor="middle" fill="#00f2fe">Multi-Agent</text></g></g>
