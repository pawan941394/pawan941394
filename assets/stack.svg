<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" role="img" aria-label="Tech stack">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1f"/><stop offset="100%" stop-color="#060814"/>
    </linearGradient>
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/><stop offset="50%" stop-color="#7f5aeb"/><stop offset="100%" stop-color="#ff0844"/>
    </linearGradient>
  </defs>
  <rect width="900" height="400" rx="16" fill="url(#bg)"/>
  <text x="450" y="40" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="800" font-family="Segoe UI, sans-serif" letter-spacing="2">TECH STACK</text>

  <!-- AI / ML / LLM CORE : highlighted hero panel -->
  <rect x="30" y="60" width="840" height="170" rx="14" fill="#0d1229" stroke="url(#aiGlow)" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="62" cy="92" r="5" fill="#00f2fe">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="78" y="97" fill="#00f2fe" font-size="15" font-weight="800" font-family="Segoe UI, sans-serif" letter-spacing="2">AI / ML / LLM CORE</text>
