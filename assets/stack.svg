<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" role="img" aria-label="Tech stack">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1f"/><stop offset="100%" stop-color="#060814"/>
    </linearGradient>
  </defs>
  <rect width="900" height="340" rx="16" fill="url(#bg)"/>
  <text x="450" y="40" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="800" font-family="Segoe UI, sans-serif" letter-spacing="2">HOLOGRAPHIC CORE</text>
  <circle cx="450" cy="175" r="48" fill="none" stroke="#7f5aeb" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="10 10">
    <animateTransform attributeName="transform" type="rotate" from="0 450 175" to="360 450 175" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="175" r="28" fill="#7f5aeb" fill-opacity="0.15" stroke="#00f2fe" stroke-width="1.5"/>
  <text x="450" y="180" text-anchor="middle" fill="#00f2fe" font-size="11" font-weight="800" font-family="Segoe UI, sans-serif">STACK</text>

