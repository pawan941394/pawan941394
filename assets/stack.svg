    <g transform="translate(685,70)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.8s" begin="0.4s" repeatCount="indefinite"/><rect width="110" height="36" rx="18" fill="#0b1224" stroke="#092E20"/><text x="55" y="23" text-anchor="middle" fill="#34d399">Django</text></g></g>
