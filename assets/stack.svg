  </g>

  <!-- Supporting stacks : dimmer -->
  <rect x="30" y="250" width="410" height="120" rx="12" fill="#0b1020" stroke="#1e293b" stroke-width="1"/>
  <text x="55" y="280" fill="#94a3b8" font-size="12" font-weight="800" font-family="Segoe UI, sans-serif" letter-spacing="1.5">LANGUAGES &amp; WEB</text>
