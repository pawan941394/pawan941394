    <g transform="translate(147,296)"><rect width="96" height="28" rx="14" fill="#0b1224" stroke="#3178C6"/><text x="48" y="18" text-anchor="middle" fill="#93c5fd">TypeScript</text></g>
    <g transform="translate(253,296)"><rect width="60" height="28" rx="14" fill="#0b1224" stroke="#4479A1"/><text x="30" y="18" text-anchor="middle" fill="#7dd3fc">SQL</text></g>
