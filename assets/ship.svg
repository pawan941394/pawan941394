<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" role="img" aria-label="What I ship">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f5aeb"/><stop offset="100%" stop-color="#ff0844"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1f"/><stop offset="100%" stop-color="#060814"/>
    </linearGradient>
  </defs>
  <rect width="900" height="320" rx="16" fill="url(#bg)"/>
  <text x="450" y="42" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="800" letter-spacing="2">WHAT I SHIP
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </text>
  <line x1="360" y1="54" x2="540" y2="54" stroke="url(#g1)" stroke-width="2">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- Voice AI card -->
  <rect x="30" y="75" width="410" height="220" rx="14" fill="#0b1224" stroke="#00f2fe" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="55" y="110" fill="#00f2fe" font-size="15" font-weight="800" font-family="Segoe UI, sans-serif">VOICE AI &amp; CONVERSATIONAL LLMs</text>
  <path fill="none" stroke="url(#g1)" stroke-width="2" d="M55,145 Q80,130 105,145 T155,145 T205,145 T255,145">
    <animate attributeName="d" dur="2.5s" repeatCount="indefinite"
      values="M55,145 Q80,130 105,145 T155,145 T205,145 T255,145;
              M55,145 Q80,160 105,145 T155,145 T205,145 T255,145;
              M55,145 Q80,130 105,145 T155,145 T205,145 T255,145"/>
  </path>
  <circle cx="55" cy="180" r="3" fill="#00f2fe"/>
  <text x="68" y="184" fill="#94a3b8" font-size="13" font-family="Segoe UI, sans-serif">Sub-second STT / TTS pipelines</text>
  <circle cx="55" cy="205" r="3" fill="#00f2fe"/>
  <text x="68" y="209" fill="#94a3b8" font-size="13" font-family="Segoe UI, sans-serif">Multi-turn agents + interruptibility</text>
  <circle cx="55" cy="230" r="3" fill="#00f2fe"/>
  <text x="68" y="234" fill="#94a3b8" font-size="13" font-family="Segoe UI, sans-serif">SIP / VoIP dialer integrations</text>
  <text x="55" y="265" fill="#00f2fe" font-size="11" font-weight="700" font-family="Segoe UI, sans-serif" letter-spacing="1">LATENCY-TUNED | PRODUCTION</text>

  <!-- Quant card -->
  <rect x="460" y="75" width="410" height="220" rx="14" fill="#0b1224" stroke="#7f5aeb" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="485" y="110" fill="#c4b5fd" font-size="15" font-weight="800" font-family="Segoe UI, sans-serif">QUANT AGENTS &amp; RAG</text>
  <g fill="url(#g2)">
    <rect x="485" y="128" width="14" height="34" rx="2"><animate attributeName="height" values="34;16;34" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="128;146;128" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="507" y="128" width="14" height="34" rx="2"><animate attributeName="height" values="20;40;20" dur="1.6s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="y" values="142;122;142" dur="1.6s" begin="0.2s" repeatCount="indefinite"/></rect>
    <rect x="529" y="128" width="14" height="34" rx="2"><animate attributeName="height" values="30;14;30" dur="1.6s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="132;148;132" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="551" y="128" width="14" height="34" rx="2"><animate attributeName="height" values="24;38;24" dur="1.6s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="y" values="138;124;138" dur="1.6s" begin="0.6s" repeatCount="indefinite"/></rect>
  </g>
  <circle cx="485" cy="180" r="3" fill="#c4b5fd"/>
  <text x="498" y="184" fill="#94a3b8" font-size="13" font-family="Segoe UI, sans-serif">Multi-agent market research systems</text>
  <circle cx="485" cy="205" r="3" fill="#c4b5fd"/>
  <text x="498" y="209" fill="#94a3b8" font-size="13" font-family="Segoe UI, sans-serif">8+ algo strategies | +25% speed</text>
  <circle cx="485" cy="230" r="3" fill="#c4b5fd"/>
  <text x="498" y="234" fill="#94a3b8" font-size="13" font-family="Segoe UI, sans-serif">Grounded finance bots (Agno)</text>
  <text x="485" y="265" fill="#c4b5fd" font-size="11" font-weight="700" font-family="Segoe UI, sans-serif" letter-spacing="1">MULTI-AGENT | TRADING</text>
</svg>
