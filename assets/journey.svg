<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" role="img" aria-label="The journey">
  <defs>
    <linearGradient id="rail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/><stop offset="50%" stop-color="#7f5aeb"/><stop offset="100%" stop-color="#ff0844"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1f"/><stop offset="100%" stop-color="#060814"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes dash { to { stroke-dashoffset: -40 } }
    @keyframes nodePulse { 0%,100%{r:7;opacity:.7} 50%{r:10;opacity:1} }
    @keyframes rise { 0%,100%{opacity:.75} 50%{opacity:1} }
    .rail{stroke-dasharray:8 8;animation:dash 1.2s linear infinite}
    .n{animation:nodePulse 2.4s ease-in-out infinite}
    .n2{animation-delay:.4s}.n3{animation-delay:.8s}.n4{animation-delay:1.2s}
    .card{animation:rise 3s ease-in-out infinite}
    .c2{animation-delay:.3s}.c3{animation-delay:.6s}.c4{animation-delay:.9s}
  </style>
  <rect width="900" height="360" rx="16" fill="url(#bg)"/>
  <text x="450" y="40" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="800" font-family="Segoe UI, sans-serif" letter-spacing="2">THE JOURNEY</text>
  <text x="450" y="64" text-anchor="middle" fill="#586799" font-size="12" font-family="Segoe UI, sans-serif" font-style="italic">"You don't need a perfect start. You need the audacity to start."</text>

  <!-- timeline rail -->
  <line x1="80" y1="120" x2="820" y2="120" stroke="url(#rail)" stroke-width="3" class="rail" stroke-linecap="round"/>
  <circle class="n" cx="140" cy="120" r="8" fill="#00f2fe"/>
  <circle class="n n2" cx="340" cy="120" r="8" fill="#4facfe"/>
  <circle class="n n3" cx="560" cy="120" r="8" fill="#7f5aeb"/>
  <circle class="n n4" cx="760" cy="120" r="8" fill="#ff0844"/>

  <!-- cards -->
  <g class="card">
    <rect x="55" y="155" width="170" height="160" rx="12" fill="#0b1224" stroke="#00f2fe" stroke-opacity=".4"/>
    <text x="140" y="185" text-anchor="middle" fill="#00f2fe" font-size="11" font-weight="800" font-family="Segoe UI, sans-serif">AGE 15</text>
    <text x="140" y="210" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700" font-family="Segoe UI, sans-serif">Cybersecurity</text>
    <text x="140" y="235" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="Segoe UI, sans-serif">Ethical hacking</text>
    <text x="140" y="255" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="Segoe UI, sans-serif">YouTube channel</text>
    <text x="140" y="285" text-anchor="middle" fill="#00f2fe" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">5,000+ subs</text>
  </g>
  <g class="card c2">
    <rect x="255" y="155" width="170" height="160" rx="12" fill="#0b1224" stroke="#4facfe" stroke-opacity=".4"/>
    <text x="340" y="185" text-anchor="middle" fill="#4facfe" font-size="11" font-weight="800" font-family="Segoe UI, sans-serif">COLLEGE</text>
    <text x="340" y="210" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700" font-family="Segoe UI, sans-serif">Full-Stack Dev</text>
    <text x="340" y="235" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="Segoe UI, sans-serif">Freelance + startup</text>
    <text x="340" y="255" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="Segoe UI, sans-serif">Led engineering</text>
    <text x="340" y="285" text-anchor="middle" fill="#4facfe" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">Team of 5</text>
  </g>
  <g class="card c3">
    <rect x="475" y="155" width="170" height="160" rx="12" fill="#0b1224" stroke="#7f5aeb" stroke-opacity=".5"/>
    <text x="560" y="185" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="800" font-family="Segoe UI, sans-serif">AI AWAKENING</text>
    <text x="560" y="210" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700" font-family="Segoe UI, sans-serif">Humanoid UI</text>
    <text x="560" y="235" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="Segoe UI, sans-serif">Robotics interface</text>
    <text x="560" y="255" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="Segoe UI, sans-serif">Pivot into ML / DL</text>
    <text x="560" y="285" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">Deep Learning</text>
  </g>
  <g class="card c4">
    <rect x="675" y="155" width="170" height="160" rx="12" fill="#0b1224" stroke="#ff0844" stroke-opacity=".5"/>
    <text x="760" y="185" text-anchor="middle" fill="#ff6b8a" font-size="11" font-weight="800" font-family="Segoe UI, sans-serif">TODAY</text>
    <text x="760" y="210" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700" font-family="Segoe UI, sans-serif">AI Systems</text>
    <text x="760" y="235" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="Segoe UI, sans-serif">Voice AI agents</text>
    <text x="760" y="255" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="Segoe UI, sans-serif">Quant + RAG</text>
    <text x="760" y="285" text-anchor="middle" fill="#ff6b8a" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">Production</text>
  </g>
</svg>
