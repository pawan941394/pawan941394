<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 176" width="100%" role="img" aria-label="NSE Option Chain Analyst">
  <g transform="translate(5,6)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3.2s" repeatCount="indefinite"/>
      <rect width="430" height="162" rx="14" fill="#0b1224" stroke="#00f2fe" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="6" height="162" rx="3" fill="#00f2fe"/>
      <text x="24" y="34" fill="#00f2fe" font-size="11" font-weight="800" font-family="Segoe UI, sans-serif">GENAI | TRADING</text>
      <text x="24" y="60" fill="#f8fafc" font-size="16" font-weight="800" font-family="Segoe UI, sans-serif">NSE Option Chain Analyst</text>
      <text x="24" y="88" fill="#94a3b8" font-size="12" font-family="Segoe UI, sans-serif">Real-time option chains + LLM reasoning</text>
      <text x="24" y="107" fill="#94a3b8" font-size="12" font-family="Segoe UI, sans-serif">for S/R, volatility &amp; trade narratives.</text>
      <text x="24" y="138" fill="#586799" font-size="11" font-family="Consolas, monospace">Python | Streamlit | NSE</text>
      <text x="406" y="138" text-anchor="end" fill="#00f2fe" font-size="11" font-weight="700" font-family="Consolas, monospace">open repo -&gt;
