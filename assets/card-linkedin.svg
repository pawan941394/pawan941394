<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 116" width="100%" role="img" aria-label="Connect on LinkedIn">
  <g transform="translate(5,8)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3.5s" repeatCount="indefinite"/>
      <rect width="280" height="100" rx="14" fill="#0b1224" stroke="#0A66C2" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <circle cx="42" cy="50" r="19" fill="#0A66C2"/>
      <text x="42" y="56" text-anchor="middle" fill="#fff" font-size="16" font-weight="800" font-family="Segoe UI, sans-serif">in</text>
      <text x="74" y="42" fill="#f8fafc" font-size="16" font-weight="700" font-family="Segoe UI, sans-serif">LinkedIn</text>
      <text x="74" y="63" fill="#94a3b8" font-size="12" font-family="Segoe UI, sans-serif">DM / network with me</text>
      <text x="74" y="84" fill="#4facfe" font-size="11" font-weight="700" font-family="Consolas, monospace">click to connect -&gt;
        <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
</svg>
