<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" role="img" aria-label="Spotlight builds">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1f"/><stop offset="100%" stop-color="#060814"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#ff0844"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes shine { 0%{stroke-dashoffset:200} 100%{stroke-dashoffset:0} }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
    @keyframes tagPulse { 0%,100%{opacity:.55} 50%{opacity:1} }
    .borderAnim{stroke-dasharray:12 8;animation:shine 2.5s linear infinite}
    .card{animation:bob 3.2s ease-in-out infinite}
    .c2{animation-delay:.35s}.c3{animation-delay:.7s}.c4{animation-delay:1.05s}
    .tag{animation:tagPulse 2.5s ease-in-out infinite}
  </style>
  <rect width="900" height="460" rx="16" fill="url(#bg)"/>
  <text x="450" y="40" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="800" font-family="Segoe UI, sans-serif" letter-spacing="2">SPOTLIGHT BUILDS</text>
  <line x1="320" y1="52" x2="580" y2="52" stroke="url(#neon)" stroke-width="2" class="borderAnim"/>

  <!-- Project 1 -->
  <g class="card" transform="translate(30,75)">
    <rect width="410" height="160" rx="14" fill="#0b1224" stroke="#00f2fe" stroke-opacity=".4" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="160" rx="3" fill="#00f2fe"/>
    <text x="24" y="36" fill="#00f2fe" font-size="11" font-weight="800" font-family="Segoe UI, sans-serif" class="tag">GENAI | TRADING</text>
    <text x="24" y="62" fill="#f8fafc" font-size="15" font-weight="800" font-family="Segoe UI, sans-serif">NSE Option Chain Analyst</text>
    <text x="24" y="90" fill="#94a3b8" font-size="12" font-family="Segoe UI, sans-serif">Real-time option chains + LLM reasoning</text>
    <text x="24" y="110" fill="#94a3b8" font-size="12" font-family="Segoe UI, sans-serif">for S/R, volatility &amp; trade narratives.</text>
    <text x="24" y="140" fill="#586799" font-size="11" font-family="Consolas, monospace">Python | Streamlit | NSE</text>
  </g>
  <!-- Project 2 -->
  <g class="card c2" transform="translate(460,75)">
    <rect width="410" height="160" rx="14" fill="#0b1224" stroke="#7f5aeb" stroke-opacity=".5" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="160" rx="3" fill="#7f5aeb"/>
    <text x="24" y="36" fill="#c4b5fd" font-size="11" font-weight="800" font-family="Segoe UI, sans-serif" class="tag">MULTI-AGENT | MEMORY</text>
    <text x="24" y="62" fill="#f8fafc" font-size="15" font-weight="800" font-family="Segoe UI, sans-serif">AgentScope Finance Bot</text>
    <text x="24" y="90" fill="#94a3b8" font-size="12" font-family="Segoe UI, sans-serif">Persistent memory across sessions for</text>
    <text x="24" y="110" fill="#94a3b8" font-size="12" font-family="Segoe UI, sans-serif">portfolios, risk profiles &amp; trade rules.</text>
    <text x="24" y="140" fill="#586799" font-size="11" font-family="Consolas, monospace">Python | AgentScope | LLM</text>
  </g>
  <!-- Project 3 -->
  <g class="card c3" transform="translate(30,260)">
    <rect width="410" height="160" rx="14" fill="#0b1224" stroke="#ff0844" stroke-opacity=".45" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="160" rx="3" fill="#ff0844"/>
    <text x="24" y="36" fill="#ff6b8a" font-size="11" font-weight="800" font-family="Segoe UI, sans-serif" class="tag">AUTOMATION | CONTENT</text>
    <text x="24" y="62" fill="#f8fafc" font-size="15" font-weight="800" font-family="Segoe UI, sans-serif">AI YouTube Automation</text>
    <text x="24" y="90" fill="#94a3b8" font-size="12" font-family="Segoe UI, sans-serif">Topic ' script ' media ' thumbnail</text>
    <text x="24" y="110" fill="#94a3b8" font-size="12" font-family="Segoe UI, sans-serif">' SEO ' auto-publish. Full factory.</text>
    <text x="24" y="140" fill="#586799" font-size="11" font-family="Consolas, monospace">OpenAI | FFmpeg | YouTube API</text>
  </g>
  <!-- Project 4 -->
  <g class="card c4" transform="translate(460,260)">
    <rect width="410" height="160" rx="14" fill="#0b1224" stroke="#4facfe" stroke-opacity=".45" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="160" rx="3" fill="#4facfe"/>
    <text x="24" y="36" fill="#4facfe" font-size="11" font-weight="800" font-family="Segoe UI, sans-serif" class="tag">MEDICAL AI | HACKATHON</text>
    <text x="24" y="62" fill="#f8fafc" font-size="15" font-weight="800" font-family="Segoe UI, sans-serif">MedX Radiographic Tutor</text>
    <text x="24" y="90" fill="#94a3b8" font-size="12" font-family="Segoe UI, sans-serif">Synthetic X-rays from diagnostic notes</text>
    <text x="24" y="110" fill="#94a3b8" font-size="12" font-family="Segoe UI, sans-serif">for medical education &amp; learning.</text>
    <text x="24" y="140" fill="#586799" font-size="11" font-family="Consolas, monospace">TypeScript | Stable Diffusion | LLMs</text>
  </g>
</svg>
