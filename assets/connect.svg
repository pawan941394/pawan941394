<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" role="img" aria-label="Let's connect">
  <defs>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#7f5aeb"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1f"/><stop offset="100%" stop-color="#060814"/>
    </linearGradient>
  </defs>
  <rect width="900" height="220" rx="16" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="897" height="217" rx="15" fill="none" stroke="url(#cg)" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="0" width="80" height="220" fill="url(#cg)" opacity="0.06">
    <animate attributeName="x" values="-80;900" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <circle cx="40" cy="40" r="4" fill="#00f2fe">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="56" y="45" fill="#00f2fe" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2">SIGNAL ONLINE</text>
  <text x="450" y="48" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="1">LET'S CONNECT</text>
  <text x="450" y="72" text-anchor="middle" fill="#586799" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Opportunities | Collaborations | Build in public</text>

  <g transform="translate(60,95)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3.5s" repeatCount="indefinite"/>
      <rect width="240" height="90" rx="12" fill="#0b1224" stroke="#0A66C2" stroke-width="1.5" stroke-opacity="0.7"/>
      <circle cx="36" cy="45" r="16" fill="#0A66C2" opacity="0.9"/>
      <text x="36" y="50" text-anchor="middle" fill="#fff" font-size="14" font-weight="800" font-family="Segoe UI, sans-serif">in</text>
      <text x="66" y="40" fill="#f8fafc" font-size="14" font-weight="700" font-family="Segoe UI, sans-serif">LinkedIn</text>
      <text x="66" y="60" fill="#94a3b8" font-size="11" font-family="Segoe UI, sans-serif">DM / network with me</text>
    </g>
  </g>
  <g transform="translate(330,95)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3.5s" begin="0.4s" repeatCount="indefinite"/>
      <rect width="240" height="90" rx="12" fill="#0b1224" stroke="#EA4335" stroke-width="1.5" stroke-opacity="0.7"/>
      <circle cx="36" cy="45" r="16" fill="#EA4335" opacity="0.9"/>
      <text x="36" y="50" text-anchor="middle" fill="#fff" font-size="12" font-weight="800" font-family="Segoe UI, sans-serif">@</text>
      <text x="66" y="40" fill="#f8fafc" font-size="14" font-weight="700" font-family="Segoe UI, sans-serif">Email</text>
      <text x="66" y="60" fill="#94a3b8" font-size="11" font-family="Segoe UI, sans-serif">Serious work inquiries</text>
    </g>
  </g>
  <g transform="translate(600,95)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3.5s" begin="0.8s" repeatCount="indefinite"/>
      <rect width="240" height="90" rx="12" fill="#0b1224" stroke="#FF0000" stroke-width="1.5" stroke-opacity="0.7"/>
      <circle cx="36" cy="45" r="16" fill="#FF0000" opacity="0.9"/>
      <polygon points="32,38 44,45 32,52" fill="#fff"/>
      <text x="66" y="40" fill="#f8fafc" font-size="14" font-weight="700" font-family="Segoe UI, sans-serif">YouTube</text>
      <text x="66" y="60" fill="#94a3b8" font-size="11" font-family="Segoe UI, sans-serif">Subscribe &amp; learn AI</text>
    </g>
  </g>
</svg>
