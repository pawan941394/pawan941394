<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 176" width="100%" role="img" aria-label="MedX Radiographic Tutor">
  <g transform="translate(5,6)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3.2s" begin="1.05s" repeatCount="indefinite"/>
      <rect width="430" height="162" rx="14" fill="#0b1224" stroke="#4facfe" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.6s" begin="1.05s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="6" height="162" rx="3" fill="#4facfe"/>
      <text x="24" y="34" fill="#4facfe" font-size="11" font-weight="800" font-family="Segoe UI, sans-serif">MEDICAL AI | HACKATHON</text>
      <text x="24" y="60" fill="#f8fafc" font-size="16" font-weight="800" font-family="Segoe UI, sans-serif">MedX Radiographic Tutor</text>
      <text x="24" y="88" fill="#94a3b8" font-size="12" font-family="Segoe UI, sans-serif">Synthetic X-rays from diagnostic notes</text>
