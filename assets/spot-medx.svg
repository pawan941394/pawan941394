      <text x="24" y="138" fill="#586799" font-size="11" font-family="Consolas, monospace">TypeScript | Stable Diffusion | LLMs</text>
      <text x="406" y="138" text-anchor="end" fill="#4facfe" font-size="11" font-weight="700" font-family="Consolas, monospace">open repo -&gt;
